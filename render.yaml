services:
  - type: web
    name: codequest
    env: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: node backend/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COOKIE_SAMESITE
        value: lax
      - key: ALLOW_MEMORY_BLOCKLIST
        value: "true"
      - key: DB_CONNECT_STRING
        sync: false
      - key: JWT_KEY
        generateValue: true
      - key: JUDGE0_BASE_URL
        value: https://judge0-ce.p.rapidapi.com
      - key: JUDGE0_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-1.5-pro
