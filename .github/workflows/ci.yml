name: CI Workflow

on:
  push:
    branches: [ main, hardening ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Production Build
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Tests with Isolated Test DB
        working-directory: ./backend
        env:
          PORT: 3000
          NODE_ENV: test
          DB_CONNECT_STRING: mongodb://localhost:27017/Leetcode_prod
          MONGO_TEST_URI: mongodb://localhost:27017/Leetcode_ci_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_KEY: test_super_secret_jwt_key_ci
        run: npm test
